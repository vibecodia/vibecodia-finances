<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Aplicativo de controle financeiro doméstico para Rodolfo e Thaís" />
    <title>Vibecodia</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  </head>
  <body>
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out;">
      <div style="position: relative; width: 100px; height: 100px; margin-bottom: 24px;">
        <img src="/favicon.svg" alt="Vibecodia Logo" style="width: 100%; height: 100%; animation: pulse 2s infinite ease-in-out;">
        <div style="position: absolute; top: -5px; left: -5px; width: 110px; height: 110px; border: 4px solid #059669; border-top-color: transparent; border-radius: 50%; animation: spin 1.5s linear infinite;"></div>
      </div>
      <h1 style="font-family: system-ui, -apple-system, sans-serif; color: #064e3b; font-size: 24px; font-weight: 600; margin: 0;">Vibecodia</h1>
      <p style="font-family: system-ui, -apple-system, sans-serif; color: #059669; font-size: 14px; margin-top: 8px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 20px;">Finances</p>
      
      <div id="loading-text" style="font-family: system-ui, -apple-system, sans-serif; color: #64748b; font-size: 13px; font-weight: 400; height: 20px; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; transform: translateY(10px);">
        Carregando dados...
      </div>
      
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(0.9); opacity: 0.8; }
        }
        .text-slime-in {
          opacity: 1 !important;
          transform: translateY(0) !important;
        }
        .text-slime-out {
          opacity: 0 !important;
          transform: translateY(-10px) !important;
        }
      </style>
      
      <script>
        window.addEventListener('load', () => {
          const texts = [
            "carregando dados",
            "sincronizando transações",
            "criando reports",
            "contas pendentes",
            "preparando tudo"
          ];
          const textElement = document.getElementById('loading-text');
          let currentTextIndex = 0;

          function updateText() {
            if (currentTextIndex >= texts.length) return;
            
            // Slime out
            textElement.classList.remove('text-slime-in');
            textElement.classList.add('text-slime-out');
            
            setTimeout(() => {
              textElement.innerText = texts[currentTextIndex] + "...";
              textElement.classList.remove('text-slime-out');
              // Slime in
              textElement.classList.add('text-slime-in');
              currentTextIndex++;
            }, 500);
          }

          // Inicia o primeiro texto
          setTimeout(updateText, 100);
          // Troca a cada 700ms para caber nos 3 segundos
          const textInterval = setInterval(updateText, 700);

          setTimeout(() => {
            clearInterval(textInterval);
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => {
              splash.style.display = 'none';
            }, 500);
          }, 3000);
        });
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
