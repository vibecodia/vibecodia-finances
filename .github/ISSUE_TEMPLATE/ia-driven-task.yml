name: "🤖 Tarefa Guiada por IA"
description: "Inicia um fluxo de trabalho de desenvolvimento orientado por IA."
title: "[IA-Driven] - "
labels: ["ia-driven", "automation"]
body:
  - type: markdown
    attributes:
      value: |
        **Atenção:** Ao criar esta issue, você acionará uma automação baseada em **Aider + OpenCode Zen (big-pickle)** que irá:
        1. Criar uma nova branch `ia/task-<issue-number>-<timestamp>`.
        2. Gerar um plano de implementação em `ia/tasks/`.
        3. Executar o **Aider** para modificar o código automaticamente.
        4. Validar as alterações (Lint/Build).
        5. Fazer o push e abrir um Pull Request.

  - type: checkboxes
    id: workflow_options
    attributes:
      label: "⚡ Opções do Workflow"
      options:
        - label: "Modo Fast (ai-fast): Execução rápida, sem plano detalhado (2 min)"
        - label: "Modo Zen (ai-zen): Tempo estendido para tarefas complexas (20 min)"

  - type: textarea
    id: task_description
    attributes:
      label: "🎯 Descrição da Tarefa"
      description: "Descreva claramente o que precisa ser feito. Esta descrição será inserida no template do plano de ação e usada como prompt principal para a IA."
      placeholder: "Ex: Adicionar um novo campo 'data de nascimento' ao formulário de usuário, incluindo validação no frontend e atualização no backend."
    validations:
      required: true
