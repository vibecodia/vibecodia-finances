name: "AI-Driven Development Workflow"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ai-driven-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ia_driven_task:
    name: "🧠 AI-Driven Task (#${{ github.event.issue.number }})"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ai-driven')

    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📥 Install aider and rtk"
        run: |
          pip install aider-chat --quiet
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "🔧 Configure Git and RTK"
        run: |
          git config user.name "IA Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          $HOME/.local/bin/rtk init -g --codex

      - name: "🔑 Validate secrets"
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY não configurado"
            exit 1
          fi
          echo "✅ Secrets OK"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: "📁 Prepare task and branch"
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="ia/task-${ISSUE_NUMBER}-${TIMESTAMP}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          mkdir -p ia/tasks
          TASK_FILE="ia/tasks/task-${ISSUE_NUMBER}.md"
          echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT

          FAST_MODE=false
          if echo "$ISSUE_LABELS" | grep -q "ai-fast"; then
            FAST_MODE=true
          fi
          echo "fast_mode=$FAST_MODE" >> $GITHUB_OUTPUT

          ZEN_MODE=false
          if echo "$ISSUE_LABELS" | grep -q "ai-zen"; then
            ZEN_MODE=true
          fi
          echo "zen_mode=$ZEN_MODE" >> $GITHUB_OUTPUT

          NO_TIMEOUT=false
          if echo "$ISSUE_LABELS" | grep -q "ai-no-timeout"; then
            NO_TIMEOUT=true
          fi
          echo "no_timeout=$NO_TIMEOUT" >> $GITHUB_OUTPUT

          {
            echo "# Task — Issue #${ISSUE_NUMBER}"
            echo ""
            echo "## What needs to be done"
            echo "$ISSUE_BODY"
            echo ""
            echo "## Rules"
            echo "- Follow existing code patterns, file structure and naming conventions"
            echo "- Frontend is under frontend/ (React, TypeScript, Vite, Tailwind CSS)"
            echo "- Backend is under backend/ (Node.js, Express, MongoDB/Mongoose)"
            echo "- Do not modify unrelated files"
            echo "- Do not change package.json, lock files or config files unless explicitly required"
            echo "- Never modify authentication, environment configuration or database schema unless explicitly requested"
            echo "- Implement only minimal and safe changes"
            echo "- Do not refactor unrelated code"
          } > "$TASK_FILE"

          git checkout -b "$BRANCH_NAME"

      - name: "🗣️ Initial comment"
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl = context.payload.repository.html_url;
            const runId = context.runId;
            const body = `### 🤖 IA Workflow Iniciado!\n\n` +
                         `Issue recebida com sucesso. A automação **Aider + OpenCode Zen** já está trabalhando nesta tarefa.\n\n` +
                         `🚀 **Acompanhe a pipeline aqui:** [GitHub Action Run](${repoUrl}/actions/runs/${runId})`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: "🧠 AI Planner"
        id: planner
        if: steps.prepare.outputs.fast_mode == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TASK_FILE: ${{ steps.prepare.outputs.task_file }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "::group::AI Planner"
          PLAN_FILE="ia/tasks/plan-${ISSUE_NUMBER}.md"

          curl https://opencode.ai/zen/v1/chat/completions \
            -s \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"big-pickle\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are a senior software engineer planning a small change in a codebase.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"Create a concise implementation plan for the following GitHub issue.\\n\\nRequirements:\\n- Identify which files likely need modification\\n- Describe the steps to implement the change\\n- Avoid unnecessary refactoring\\n- Keep the change minimal and safe\\n\\nIssue:\\n$(cat "$TASK_FILE" | sed 's/"/\\"/g' | tr -d '\n')\"
                }
              ]
            }" | jq -r '.choices[0].message.content' > "$PLAN_FILE"

          if [ ! -s "$PLAN_FILE" ] || [ "$(cat "$PLAN_FILE")" = "null" ]; then
            echo "::error::Falha ao gerar o plano de implementação"
            exit 1
          fi

          echo "plan_file=$PLAN_FILE" >> $GITHUB_OUTPUT
          echo "::endgroup::"


      - name: "🔁 Aider"
        id: aider_run
        timeout-minutes: ${{ (steps.prepare.outputs.no_timeout == 'true' && 360) || (steps.prepare.outputs.zen_mode == 'true' && 20) || (steps.prepare.outputs.fast_mode == 'true' && 2) || 4 }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_BASE: https://opencode.ai/zen/v1
          TASK_FILE: ${{ steps.prepare.outputs.task_file }}
          PLAN_FILE: ${{ steps.planner.outputs.plan_file }}
          FAST_MODE: ${{ steps.prepare.outputs.fast_mode }}
        run: |
          echo "::group::Aider"

          RELEVANT_FILES=$(git ls-files 'frontend/src' 'backend' | grep -E '\.(tsx|ts|js)$' | head -n 80 | tr '\n' ' ')
          echo "📄 Files: $RELEVANT_FILES"

          if [ "$FAST_MODE" = "true" ]; then
            MESSAGE="$(cat "$TASK_FILE")"
          else
            MESSAGE="$(cat "$TASK_FILE")

          Implementation Plan:
          $(cat "$PLAN_FILE")"
          fi

          aider \
            --yes-always \
            --no-pretty \
            --model openai/big-pickle \
            --map-tokens 1024 \
            --no-auto-commits \
            --message "$MESSAGE" \
            $RELEVANT_FILES

          {
            echo "ai_summary<<EOF"
            git diff --name-only HEAD | sed 's/^/- /'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if command -v rtk >/dev/null 2>&1; then
            {
              echo "rtk_gain<<EOF"
              rtk gain
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "::endgroup::"

      - name: "🔍 Validate: install dependencies"
        id: install
        if: steps.aider_run.outcome == 'success'
        run: |
          echo "::group::Installing dependencies"
          cd frontend && npm ci --prefer-offline 2>&1 | tail -5
          cd ../backend && npm ci --prefer-offline 2>&1 | tail -5
          echo "::endgroup::"

      - name: "🔍 Validate: lint"
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          echo "::group::Lint"
          LINT_ERRORS=0

          cd frontend
          echo "--- Frontend lint ---"
          npm run lint 2>&1 || LINT_ERRORS=$((LINT_ERRORS + 1))
          cd ..

          cd backend
          echo "--- Backend lint ---"
          npm run lint 2>&1 || LINT_ERRORS=$((LINT_ERRORS + 1))
          cd ..

          echo "lint_errors=$LINT_ERRORS" >> $GITHUB_OUTPUT
          echo "::endgroup::"

          if [ $LINT_ERRORS -gt 0 ]; then
            echo "::warning::Lint encontrou erros — revise antes de fazer merge"
          fi

      - name: "🔍 Validate: build"
        id: build
        if: steps.install.outcome == 'success'
        run: |
          echo "::group::Build"
          BUILD_FAILED=0

          cd frontend
          echo "--- Frontend build ---"
          npm run build 2>&1 || BUILD_FAILED=1
          cd ..

          echo "build_failed=$BUILD_FAILED" >> $GITHUB_OUTPUT
          echo "::endgroup::"

          if [ $BUILD_FAILED -eq 1 ]; then
            echo "::error::Build do frontend falhou — as alterações da IA quebraram o projeto"
            exit 1
          fi

      - name: "💾 Commit and push changes"
        id: push_changes
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          LINT_ERRORS: ${{ steps.lint.outputs.lint_errors }}
        run: |
          git reset HEAD .aider.chat.history.md .aider.input.history 2>/dev/null || true
          git add frontend backend

          if git diff --staged --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No code changes detected."
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT

            LINT_NOTE=""
            [ "${LINT_ERRORS}" != "0" ] && LINT_NOTE=" [lint warnings]"

            git commit \
              -m "feat(ia): implement solution for #${ISSUE_NUMBER}" \
              -m "Generated by gpt-5-mini + aider.${LINT_NOTE}" \
              -m "Issue: ${ISSUE_URL}"
          fi

          git push origin "$BRANCH_NAME"

      - name: "🔀 Create Pull Request"
        id: create_pr
        if: steps.push_changes.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AI_SUMMARY: ${{ steps.aider_run.outputs.ai_summary }}
          PLAN_FILE: ${{ steps.planner.outputs.plan_file }}
        run: |
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            PLAN_CONTENT=""
            if [ -f "$PLAN_FILE" ]; then
              PLAN_CONTENT=$(cat "$PLAN_FILE")
            fi

            BODY="Closes #${ISSUE_NUMBER}

            ### 🤖 AI Implementation

            $([ -n "$PLAN_CONTENT" ] && echo "**Implementation Plan:**
            \`\`\`
            ${PLAN_CONTENT}
            \`\`\`")

            $([ -n "$AI_SUMMARY" ] && echo "**Files modified:**
            ${AI_SUMMARY}")

            > Generated by gpt-4o-mini + aider. Review before merging."

            PR_URL=$(gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "feat(ia): solution for #${ISSUE_NUMBER}" \
              --body "$BODY")

            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          else
            echo "pr_url=$(gh pr view "$PR_EXISTS" --json url --jq '.url')" >> $GITHUB_OUTPUT
          fi

      - name: "📝 Generate step summary"
        if: always()
        env:
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
          AIDER_OUTCOME: ${{ steps.aider_run.outcome }}
          PLANNER_OUTCOME: ${{ steps.planner.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          LINT_ERRORS: ${{ steps.lint.outputs.lint_errors }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          AI_SUMMARY: ${{ steps.aider_run.outputs.ai_summary }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          FAST_MODE: ${{ steps.prepare.outputs.fast_mode }}
          ZEN_MODE: ${{ steps.prepare.outputs.zen_mode }}
          NO_TIMEOUT: ${{ steps.prepare.outputs.no_timeout }}
          RTK_GAIN: ${{ steps.aider_run.outputs.rtk_gain }}
        run: |
          echo "## 🤖 AI-Driven Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          if [ "$FAST_MODE" = "true" ]; then
            echo "| ⚡ | Mode | Fast mode (2min timeout) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$ZEN_MODE" = "true" ]; then
            echo "| 🧘 | Mode | Zen mode (20min timeout) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$NO_TIMEOUT" = "true" ]; then
            echo "| 🚀 | Mode | No timeout mode (6h limit) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧠 | Mode | Standard mode with AI Planner |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RTK_GAIN" ]; then
            echo "| 📉 | RTK Savings | Token optimization active |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PLANNER_OUTCOME" = "success" ]; then
            echo "| ✅ | AI Planner | Plan generated |" >> $GITHUB_STEP_SUMMARY
          elif [ "$PLANNER_OUTCOME" = "skipped" ]; then
            echo "| ⏭️ | AI Planner | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$AIDER_OUTCOME" = "success" ]; then
            echo "| ✅ | Aider | Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ | Aider | Failed or Timeout |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$LINT_OUTCOME" = "success" ]; then
            if [ "${LINT_ERRORS}" = "0" ]; then
              echo "| ✅ | Lint | No errors |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ⚠️ | Lint | Errors found |" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$LINT_OUTCOME" = "skipped" ]; then
            echo "| ⏭️ | Lint | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BUILD_OUTCOME" = "success" ]; then
            echo "| ✅ | Build | Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            echo "| ❌ | Build | Failed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_OUTCOME" = "skipped" ]; then
            echo "| ⏭️ | Build | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CHANGES_DETECTED" = "true" ]; then
            echo "| ✅ | Changes | Pushed to \`$BRANCH_NAME\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ℹ️ | Changes | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$PR_URL" ]; then
            echo "| ✅ | PR | [View Pull Request]($PR_URL) |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RTK_GAIN" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📉 RTK Token Optimization" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$RTK_GAIN" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$AI_SUMMARY" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Files modified" >> $GITHUB_STEP_SUMMARY
            echo "$AI_SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🗣️ Comment on issue"
        if: always()
        uses: actions/github-script@v7
        env:
          AIDER_OUTCOME: ${{ steps.aider_run.outcome }}
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
          LINT_ERRORS: ${{ steps.lint.outputs.lint_errors }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          AI_SUMMARY: ${{ steps.aider_run.outputs.ai_summary }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          FAST_MODE: ${{ steps.prepare.outputs.fast_mode }}
          ZEN_MODE: ${{ steps.prepare.outputs.zen_mode }}
          NO_TIMEOUT: ${{ steps.prepare.outputs.no_timeout }}
        with:
          script: |
            const { AIDER_OUTCOME, CHANGES_DETECTED, LINT_ERRORS, BUILD_OUTCOME, BRANCH_NAME, AI_SUMMARY, PR_URL, FAST_MODE, ZEN_MODE, NO_TIMEOUT } = process.env;
            const repoUrl    = context.payload.repository.html_url;
            const hasChanges = CHANGES_DETECTED === 'true';
            const success    = AIDER_OUTCOME === 'success';
            const buildOk    = BUILD_OUTCOME === 'success';
            const lintErrors = parseInt(LINT_ERRORS || '0');
            const fastMode   = FAST_MODE === 'true';
            const zenMode    = ZEN_MODE === 'true';
            const noTimeout  = NO_TIMEOUT === 'true';

            let body = `### 🤖 IA Workflow Results\n\n`;
            body += `**Mode:** ${fastMode ? '⚡ Fast (2min)' : zenMode ? '🧘 Zen (20min)' : noTimeout ? '🚀 No Timeout (6h)' : '🧠 Full with AI Planner'}\n\n`;

            if (success && hasChanges && buildOk) {
              body += `✅ **Success!** Changes implemented via **gpt-5-mini + aider**.\n\n`;
              body += `- **Branch**: [\`${BRANCH_NAME}\`](${repoUrl}/tree/${BRANCH_NAME})\n`;
              body += `- **Build**: ✅ passed\n`;
              body += `- **Lint**: ${lintErrors === 0 ? '✅ no errors' : `⚠️ ${lintErrors} error(s) — review before merging`}\n`;
              if (PR_URL) {
                body += `- **PR**: [View Pull Request](${PR_URL})\n`;
              }
              if (AI_SUMMARY) {
                body += `\n**Files modified:**\n${AI_SUMMARY}\n`;
              }
              body += `\n> Review the PR and merge into \`develop\` when ready.`;
            } else if (success && BUILD_OUTCOME === 'failure') {
              body += `⚠️ **AI made changes but the build failed.**\n\n`;
              body += `The generated code broke the frontend build — commit was blocked.\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for the build error.`;
            } else if (success && !hasChanges) {
              body += `⚠️ **AI ran but made no changes.**\n\n`;
              body += `Try adding more detail to the issue description.`;
            } else if (AIDER_OUTCOME === 'failure' || AIDER_OUTCOME === 'cancelled') {
              body += `❌ **Workflow failed due to timeout.**\n\n`;
              body += `The experimental AI-driven workflow has reached its **${fastMode ? '2' : '4'}-minute limit**.\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for details.`;
            } else {
              body += `❌ **Workflow failed.**\n\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for details.\n\n`;
              body += `Common causes: token limit exceeded, API quota, or task description too vague.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
