name: "AI-Driven Development Workflow v2"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ai-driven-v2-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  initialize:
    name: "Initialize Task (#${{ github.event.issue.number }})"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ai-driven')
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      task_file: ${{ steps.prepare.outputs.task_file }}
      fast_mode: ${{ steps.prepare.outputs.fast_mode }}
      zen_mode: ${{ steps.prepare.outputs.zen_mode }}
      timeless: ${{ steps.prepare.outputs.timeless }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: 'develop'
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: "🗣️ Initial comment"
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl = context.payload.repository.html_url;
            const runId = context.runId;
            const footer = `\n\n---\n> *Triaged automatically by **vibecodia v2** · This is an automated implementation, not a human review.*`;
            const body = `### 🤖 IA Workflow v2 Iniciado!\n\n` +
                         `Issue recebida com sucesso. A automação **Aider + OpenCode Zen (v2)** já está trabalhando nesta tarefa.\n\n` +
                         `🚀 **Acompanhe a pipeline aqui:** [GitHub Action Run](${repoUrl}/actions/runs/${runId})` +
                         footer;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: "📁 Prepare task and branch"
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="ia/task-${ISSUE_NUMBER}-${TIMESTAMP}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          mkdir -p ia/tasks
          TASK_FILE="ia/tasks/task-${ISSUE_NUMBER}.md"
          echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT

          FAST_MODE=false
          if echo "$ISSUE_LABELS" | grep -q "ai-fast"; then
            FAST_MODE=true
          fi
          echo "fast_mode=$FAST_MODE" >> $GITHUB_OUTPUT

          ZEN_MODE=false
          if echo "$ISSUE_LABELS" | grep -q "ai-zen"; then
            ZEN_MODE=true
          fi
          echo "zen_mode=$ZEN_MODE" >> $GITHUB_OUTPUT

          TIMELESS=false
          if echo "$ISSUE_LABELS" | grep -q "ai-timeless"; then
            TIMELESS=true
          fi
          echo "timeless=$TIMELESS" >> $GITHUB_OUTPUT

          # Use entire issue body to avoid extraction issues
          {
            echo "# Task — Issue #${ISSUE_NUMBER}"
            echo ""
            echo "## What needs to be done"
            echo "$ISSUE_BODY"
            echo ""
            echo "## Rules"
            echo "- Follow existing code patterns, file structure and naming conventions"
            echo "- Frontend is under frontend/ (React, TypeScript, Vite, Tailwind CSS)"
            echo "- Backend is under backend/ (Node.js, Express, MongoDB/Mongoose)"
            echo "- Do not modify unrelated files"
            echo "- Do not change package.json, lock files or config files unless explicitly required"
            echo "- Never modify authentication, environment configuration or database schema unless explicitly requested"
            echo "- Implement only minimal and safe changes"
            echo "- Do not refactor unrelated code"
            echo "- Never create unused imports/vars - prefix unused params with _"
            echo "- Verify with npx tsc --noEmit"
          } > "$TASK_FILE"

          git config user.name "IA Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add "$TASK_FILE"
          git commit -m "chore: add task file for issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH_NAME"

  planner:
    name: "AI Planner"
    runs-on: ubuntu-latest
    needs: initialize
    if: needs.initialize.outputs.fast_mode == 'false'
    outputs:
      plan_file: ${{ steps.planner.outputs.plan_file }}
      plan_content: ${{ steps.planner.outputs.plan_content }}
      is_minimal: ${{ steps.analyze_plan.outputs.is_minimal }}
      is_safe: ${{ steps.analyze_plan.outputs.is_safe }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "🧠 AI Planner"
        id: planner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TASK_FILE: ${{ needs.initialize.outputs.task_file }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "::group::AI Planner"
          PLAN_FILE="ia/tasks/plan-${ISSUE_NUMBER}.md"
          ISSUE_CONTENT=$(cat "$TASK_FILE")
          PAYLOAD=$(jq -n \
            --arg system "You are a senior software engineer planning a small change in a codebase." \
            --arg user "Create a concise implementation plan for the following GitHub issue.\n\nRequirements:\n- Identify which files likely need modification\n- Describe the steps to implement the change\n- Avoid unnecessary refactoring\n- Keep the change minimal and safe\n\nIssue:\n$ISSUE_CONTENT" \
            '{
              model: "big-pickle",
              messages: [
                { role: "system", content: $system },
                { role: "user", content: $user }
              ]
            }')

          curl https://opencode.ai/zen/v1/chat/completions \
            -s \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD" | jq -r '.choices[0].message.content' > "$PLAN_FILE"

          if [ ! -s "$PLAN_FILE" ] || [ "$(cat "$PLAN_FILE")" = "null" ]; then
            echo "::error::Falha ao gerar o plano de implementação"
            exit 1
          fi

          echo "plan_file=$PLAN_FILE" >> $GITHUB_OUTPUT
          {
            echo "plan_content<<EOF"
            cat "$PLAN_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: "🔍 Analyze plan for minimal/safe change"
        id: analyze_plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PLAN_FILE: ${{ steps.planner.outputs.plan_file }}
        run: |
          PLAN_CONTENT=$(cat "$PLAN_FILE")
          PAYLOAD=$(jq -n \
            --arg system "You are a code change classifier. Respond ONLY with valid JSON, no markdown, no extra text." \
            --arg user "Classify this implementation plan. Respond with JSON: {\"is_minimal\": true/false, \"is_safe\": true/false}\n\nCriteria:\n- is_minimal: ≤3 files modified, small scope, focused change\n- is_safe: no config/package changes, no refactoring, no breaking changes, no auth/db schema changes\n\nPlan:\n$PLAN_CONTENT" \
            '{
              model: "big-pickle",
              messages: [
                { role: "system", content: $system },
                { role: "user", content: $user }
              ]
            }')

          CLASSIFICATION=$(curl https://opencode.ai/zen/v1/chat/completions \
            -s \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD" | jq -r '.choices[0].message.content')

          IS_MINIMAL=$(echo "$CLASSIFICATION" | jq -r '.is_minimal')
          IS_SAFE=$(echo "$CLASSIFICATION" | jq -r '.is_safe')
          
          echo "is_minimal=$IS_MINIMAL" >> $GITHUB_OUTPUT
          echo "is_safe=$IS_SAFE" >> $GITHUB_OUTPUT

      - name: "🏷️ Apply labels to issue"
        uses: actions/github-script@v7
        env:
          IS_MINIMAL: ${{ steps.analyze_plan.outputs.is_minimal }}
          IS_SAFE: ${{ steps.analyze_plan.outputs.is_safe }}
        with:
          script: |
            const { IS_MINIMAL, IS_SAFE } = process.env;
            const labels = [];
            
            if (IS_MINIMAL === 'true') {
              labels.push('minimal-change');
            }
            if (IS_SAFE === 'true') {
              labels.push('safe-change');
            }
            if (IS_MINIMAL === 'true' && IS_SAFE === 'true') {
              labels.push('triage-ok');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }

      - name: "🗣️ Planner comment"
        uses: actions/github-script@v7
        env:
          PLAN_FILE: ${{ steps.planner.outputs.plan_file }}
          BRANCH_NAME: ${{ needs.initialize.outputs.branch_name }}
          IS_MINIMAL: ${{ steps.analyze_plan.outputs.is_minimal }}
          IS_SAFE: ${{ steps.analyze_plan.outputs.is_safe }}
        with:
          script: |
            const fs = require('fs');
            const repoUrl = context.payload.repository.html_url;
            const planContent = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const { IS_MINIMAL, IS_SAFE } = process.env;
            const footer = `\n\n---\n> *Triaged automatically by **vibecodia v2** · This is an automated implementation, not a human review.*`;
            
            let body = `### 🧠 Plano de Implementação Gerado!\n\n`;
            body += `O **AI Planner (v2)** analisou a tarefa e traçou o seguinte roteiro:\n\n`;
            body += `\`\`\`markdown\n${planContent}\n\`\`\`\n\n`;
            
            const labelsApplied = [];
            if (IS_MINIMAL === 'true') labelsApplied.push('`minimal-change`');
            if (IS_SAFE === 'true') labelsApplied.push('`safe-change`');
            if (IS_MINIMAL === 'true' && IS_SAFE === 'true') labelsApplied.push('`triage-ok`');
            
            if (labelsApplied.length > 0) {
              body += `🏷️ **Labels aplicados:** ${labelsApplied.join(', ')}\n\n`;
            }
            
            body += `🛠️ **Próximo passo:** O **Aider** iniciará a codificação na branch [**${process.env.BRANCH_NAME}**](${repoUrl}/tree/${process.env.BRANCH_NAME}).`;
            body += footer;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  code:
    name: "AI Coding (${{ matrix.mode }})"
    runs-on: ubuntu-latest
    needs: [initialize]
    strategy:
      fail-fast: false
      matrix:
        mode: ["aider"]
    timeout-minutes: ${{ contains(github.event.issue.labels.*.name, 'ai-timeless') && 360 || contains(github.event.issue.labels.*.name, 'ai-zen') && 20 || contains(github.event.issue.labels.*.name, 'ai-fast') && 2 || 4 }}
    outputs:
      ai_summary: ${{ steps.aider_run.outputs.ai_summary }}
    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📥 Install aider and rtk"
        run: |
          pip install aider-chat --quiet
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "🔧 Configure Git and RTK Shims"
        run: |
          git config user.name "IA Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          
          mkdir -p $HOME/.rtk/shims
          for cmd in git ls grep rg; do
            REAL_PATH=$(which -a $cmd | grep -v "$HOME/.rtk/shims" | head -n 1)
            echo "#!/bin/bash" > $HOME/.rtk/shims/$cmd
            echo "if [[ \"\$RTK_INSIDE\" == \"1\" ]]; then" >> $HOME/.rtk/shims/$cmd
            echo "  $REAL_PATH \"\$@\"" >> $HOME/.rtk/shims/$cmd
            echo "else" >> $HOME/.rtk/shims/$cmd
            echo "  RTK_INSIDE=1 rtk $cmd \"\$@\"" >> $HOME/.rtk/shims/$cmd
            echo "fi" >> $HOME/.rtk/shims/$cmd
            chmod +x $HOME/.rtk/shims/$cmd
          done
          echo "$HOME/.rtk/shims" >> $GITHUB_PATH
          
          rtk init -g --opencode

      - name: "🔑 Validate secrets"
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY não configurado"
            exit 1
          fi
          echo "✅ Secrets OK"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: "🔁 Aider"
        id: aider_run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_BASE: https://opencode.ai/zen/v1
          TASK_FILE: ${{ needs.initialize.outputs.task_file }}
          FAST_MODE: ${{ needs.initialize.outputs.fast_mode }}
        run: |
          echo "::group::Aider"

          RELEVANT_FILES=$(git ls-files 'frontend/src' 'backend' | grep -E '\.(tsx|ts|js)$' | head -n 80 | tr '\n' ' ')
          echo "📄 Files: $RELEVANT_FILES"

          if [ "$FAST_MODE" = "true" ]; then
            MESSAGE="$(cat "$TASK_FILE")"
          else
            # Try to read plan file if it exists
            PLAN_FILE="ia/tasks/plan-${{ github.event.issue.number }}.md"
            if [ -f "$PLAN_FILE" ]; then
              PLAN_CONTENT=$(cat "$PLAN_FILE")
              MESSAGE="$(cat "$TASK_FILE")

          Implementation Plan:
          $PLAN_CONTENT"
            else
              MESSAGE="$(cat "$TASK_FILE")"
            fi
          fi

          aider \
            --yes-always \
            --no-pretty \
            --model openai/big-pickle \
            --map-tokens 1024 \
            --no-auto-commits \
            --message "$MESSAGE" \
            $RELEVANT_FILES

          # Commit changes (jobs use separate runners - must commit here)
          git config user.name "IA Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add frontend backend
          if ! git diff --staged --quiet; then
            git commit -m "feat(ia): apply AI-generated changes"
            git push origin "${{ needs.initialize.outputs.branch_name }}"
          fi

          {
            echo "ai_summary<<EOF"
            git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD | sed 's/^/- /'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

      - name: "🧹 Cleanup TS"
        run: |
          cd frontend
          (npx eslint --fix 'src/**/*.{ts,tsx}' --rule '@typescript-eslint/no-unused-vars: error' || true)
          (npx prettier --write 'src/**/*.{ts,tsx}' || true)
          
          git add .
          if ! git diff --staged --quiet; then
              git commit -m "style(mascodev): refactor and clean up frontend code"
              # Faz o push explicitamente para a branch que o dev já está trabalhando
              git push origin HEAD
          else
              echo "Nenhuma alteração pendente detectada pelo Mascodev."
          fi

  validate:
    name: "Validate (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs: [initialize, code]
    strategy:
      fail-fast: false
      matrix:
        target: ["frontend", "backend"]
    outputs:
      lint_errors_frontend: ${{ steps.lint_frontend.outputs.lint_errors }}
      lint_errors_backend: ${{ steps.lint_backend.outputs.lint_errors }}
      build_failed: ${{ steps.build.outputs.build_failed }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🔍 Install dependencies (${{ matrix.target }})"
        run: |
          echo "::group::Installing ${{ matrix.target }} dependencies"
          cd ${{ matrix.target }} && npm ci --prefer-offline 2>&1 | tail -5
          echo "::endgroup::"

      - name: "🔍 Lint (${{ matrix.target }})"
        id: lint
        continue-on-error: true
        run: |
          echo "::group::Lint ${{ matrix.target }}"
          LINT_ERRORS=0
          cd ${{ matrix.target }}
          npm run lint 2>&1 || LINT_ERRORS=1
          echo "lint_errors=$LINT_ERRORS" >> $GITHUB_OUTPUT
          echo "::endgroup::"
          if [ $LINT_ERRORS -gt 0 ]; then
            echo "::warning::Lint encontrou erros em ${{ matrix.target }} — revise antes de fazer merge"
          fi

      - name: "🔍 Build (frontend only)"
        id: build
        if: matrix.target == 'frontend'
        run: |
          echo "::group::Build frontend"
          BUILD_FAILED=0
          cd frontend
          npm run build 2>&1 || BUILD_FAILED=1
          echo "build_failed=$BUILD_FAILED" >> $GITHUB_OUTPUT
          echo "::endgroup::"
          if [ $BUILD_FAILED -eq 1 ]; then
            echo "::error::Build do frontend falhou — as alterações da IA quebraram o projeto"
            exit 1
          fi

  deliver:
    name: "Deliver"
    runs-on: ubuntu-latest
    needs: [initialize, code, validate]
    outputs:
      changes_detected: ${{ steps.push_changes.outputs.changes_detected }}
      push_success: ${{ steps.push_changes.outputs.push_success }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      final_is_minimal: ${{ steps.analyze_changes.outputs.is_minimal }}
      final_is_safe: ${{ steps.analyze_changes.outputs.is_safe }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.branch_name }}
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: "💾 Check for committed changes"
        id: push_changes
        env:
          BRANCH_NAME: ${{ needs.initialize.outputs.branch_name }}
        run: |
          # Check if there are any commits that modify frontend/ or backend/ files (excluding initial task file)
          if git log --oneline -1 --name-only | grep -q -E "^(frontend|backend)/"; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "push_success=true" >> $GITHUB_OUTPUT
            echo "✅ Found committed code changes."
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No code changes detected."
          fi

      - name: "🔍 Analyze actual code changes"
        id: analyze_changes
        if: steps.push_changes.outputs.changes_detected == 'true'
        run: |
          # Get list of modified files
          MODIFIED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          FILE_COUNT=$(echo "$MODIFIED_FILES" | grep -c .)
          
          # Check if only a few files were modified
          IS_MINIMAL=false
          if [ "$FILE_COUNT" -le 3 ]; then
            IS_MINIMAL=true
          fi
          
          # Check if no config/package files were modified
          IS_SAFE=true
          if echo "$MODIFIED_FILES" | grep -q -E "(package\.json|package-lock\.json|\.env|config|schema)"; then
            IS_SAFE=false
          fi
          
          echo "is_minimal=$IS_MINIMAL" >> $GITHUB_OUTPUT
          echo "is_safe=$IS_SAFE" >> $GITHUB_OUTPUT

      - name: "🏷️ Update labels based on actual changes"
        uses: actions/github-script@v7
        if: steps.push_changes.outputs.changes_detected == 'true'
        env:
          FINAL_IS_MINIMAL: ${{ steps.analyze_changes.outputs.is_minimal }}
          FINAL_IS_SAFE: ${{ steps.analyze_changes.outputs.is_safe }}
        with:
          script: |
            const { FINAL_IS_MINIMAL, FINAL_IS_SAFE } = process.env;
            
            // Get current labels first
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const currentLabelNames = currentLabels.map(l => l.name);
            const newLabels = [...currentLabelNames];
            
            // Add or remove labels based on actual changes
            if (FINAL_IS_MINIMAL === 'true' && !newLabels.includes('minimal-change')) {
              newLabels.push('minimal-change');
            } else if (FINAL_IS_MINIMAL === 'false') {
              const idx = newLabels.indexOf('minimal-change');
              if (idx !== -1) newLabels.splice(idx, 1);
            }
            
            if (FINAL_IS_SAFE === 'true' && !newLabels.includes('safe-change')) {
              newLabels.push('safe-change');
            } else if (FINAL_IS_SAFE === 'false') {
              const idx = newLabels.indexOf('safe-change');
              if (idx !== -1) newLabels.splice(idx, 1);
            }
            
            if (FINAL_IS_MINIMAL === 'true' && FINAL_IS_SAFE === 'true' && !newLabels.includes('triage-ok')) {
              newLabels.push('triage-ok');
            } else {
              const idx = newLabels.indexOf('triage-ok');
              if (idx !== -1) newLabels.splice(idx, 1);
            }
            
            // Update labels
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: newLabels
            });

      - name: "🔀 Create Pull Request"
        id: create_pr
        if: steps.push_changes.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          BRANCH_NAME: ${{ needs.initialize.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AI_SUMMARY: ${{ needs.code.outputs.ai_summary }}
        run: |
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')

          # Try to read plan file if it exists
          PLAN_FILE="ia/tasks/plan-${ISSUE_NUMBER}.md"
          PLAN_CONTENT=""
          if [ -f "$PLAN_FILE" ]; then
            PLAN_CONTENT=$(cat "$PLAN_FILE")
          fi

          if [ -z "$PR_EXISTS" ]; then
            BODY="Closes #${ISSUE_NUMBER}

            ### 🤖 AI Implementation (v2)

            $([ -n "$PLAN_CONTENT" ] && echo "**Implementation Plan:**
            \`\`\`
            ${PLAN_CONTENT}
            \`\`\`")

            $([ -n "$AI_SUMMARY" ] && echo "**Files modified:**
            ${AI_SUMMARY}")

            > Generated by gpt-4o-mini + aider (v2). Review before merging."

            PR_URL=$(gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "feat(ia): solution for #${ISSUE_NUMBER} (v2)" \
              --body "$BODY")

            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          else
            echo "pr_url=$(gh pr view "$PR_EXISTS" --json url --jq '.url')" >> $GITHUB_OUTPUT
          fi

  report:
    name: "Report"
    runs-on: ubuntu-latest
    needs: [initialize, code, validate, deliver]
    if: always()
    steps:
      - name: "📉 Capture RTK savings"
        id: rtk_capture
        run: |
          echo "rtk_gain=" >> $GITHUB_OUTPUT

      - name: "📊 Generate step summary"
        env:
          CHANGES_DETECTED: ${{ needs.deliver.outputs.changes_detected }}
          PUSH_SUCCESS: ${{ needs.deliver.outputs.push_success }}
          AIDER_OUTCOME: ${{ needs.code.result }}
          LINT_ERRORS_FRONTEND: ${{ needs.validate.outputs.lint_errors_frontend }}
          LINT_ERRORS_BACKEND: ${{ needs.validate.outputs.lint_errors_backend }}
          BUILD_OUTCOME: ${{ needs.validate.result }}
          AI_SUMMARY: ${{ needs.code.outputs.ai_summary }}
          BRANCH_NAME: ${{ needs.initialize.outputs.branch_name }}
          PR_URL: ${{ needs.deliver.outputs.pr_url }}
          FAST_MODE: ${{ needs.initialize.outputs.fast_mode }}
          ZEN_MODE: ${{ needs.initialize.outputs.zen_mode }}
          TIMELESS: ${{ needs.initialize.outputs.timeless }}
          RTK_GAIN: ${{ steps.rtk_capture.outputs.rtk_gain }}
        run: |
          echo "## 🤖 AI-Driven Workflow v2 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          if [ "$FAST_MODE" = "true" ]; then
            echo "| ⚡ | Mode | Fast mode (2min timeout) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$ZEN_MODE" = "true" ]; then
            echo "| 🧘 | Mode | Zen mode (20min timeout) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$TIMELESS" = "true" ]; then
            echo "| 🚀 | Mode | Timeless mode (6h limit) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧠 | Mode | Standard mode with AI Planner |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RTK_GAIN" ]; then
            echo "| 📉 | RTK Savings | Token optimization active |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check if plan file exists to determine planner status
          PLAN_FILE="ia/tasks/plan-${{ github.event.issue.number }}.md"
          if [ "$FAST_MODE" = "false" ] && [ -f "$PLAN_FILE" ]; then
            echo "| ✅ | AI Planner | Plan generated |" >> $GITHUB_STEP_SUMMARY
          elif [ "$FAST_MODE" = "true" ]; then
            echo "| ⏭️ | AI Planner | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$AIDER_OUTCOME" = "success" ]; then
            echo "| ✅ | Aider | Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ | Aider | Failed or Timeout |" >> $GITHUB_STEP_SUMMARY
          fi

          TOTAL_LINT_ERRORS=$(( ${LINT_ERRORS_FRONTEND:-0} + ${LINT_ERRORS_BACKEND:-0} ))
          if [ "$BUILD_OUTCOME" = "success" ]; then
            if [ "$TOTAL_LINT_ERRORS" = "0" ]; then
              echo "| ✅ | Lint | No errors |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ⚠️ | Lint | Errors found |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| ✅ | Build | Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            echo "| ❌ | Build | Failed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_OUTCOME" = "skipped" ]; then
            echo "| ⏭️ | Build | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CHANGES_DETECTED" = "true" ]; then
            echo "| ✅ | Changes | Pushed to **$BRANCH_NAME** |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ℹ️ | Changes | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$PR_URL" ]; then
            echo "| ✅ | PR | [View Pull Request]($PR_URL) |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$AI_SUMMARY" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Files modified" >> $GITHUB_STEP_SUMMARY
            echo "$AI_SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "> *Triaged automatically by **vibecodia v2** · This is an automated implementation, not a human review.*" >> $GITHUB_STEP_SUMMARY

      - name: "🗣️ Comment on issue"
        uses: actions/github-script@v7
        env:
          AIDER_OUTCOME: ${{ needs.code.result }}
          CHANGES_DETECTED: ${{ needs.deliver.outputs.changes_detected }}
          PUSH_SUCCESS: ${{ needs.deliver.outputs.push_success }}
          LINT_ERRORS_FRONTEND: ${{ needs.validate.outputs.lint_errors_frontend }}
          LINT_ERRORS_BACKEND: ${{ needs.validate.outputs.lint_errors_backend }}
          BUILD_OUTCOME: ${{ needs.validate.result }}
          BRANCH_NAME: ${{ needs.initialize.outputs.branch_name }}
          AI_SUMMARY: ${{ needs.code.outputs.ai_summary }}
          PR_URL: ${{ needs.deliver.outputs.pr_url }}
          FAST_MODE: ${{ needs.initialize.outputs.fast_mode }}
          ZEN_MODE: ${{ needs.initialize.outputs.zen_mode }}
          TIMELESS: ${{ needs.initialize.outputs.timeless }}
        with:
          script: |
            const { AIDER_OUTCOME, CHANGES_DETECTED, PUSH_SUCCESS, LINT_ERRORS_FRONTEND, LINT_ERRORS_BACKEND, BUILD_OUTCOME, BRANCH_NAME, AI_SUMMARY, PR_URL, FAST_MODE, ZEN_MODE, TIMELESS } = process.env;
            const repoUrl    = context.payload.repository.html_url;
            const hasChanges = CHANGES_DETECTED === 'true';
            const pushOk     = PUSH_SUCCESS === 'true';
            const success    = AIDER_OUTCOME === 'success';
            const buildOk    = BUILD_OUTCOME === 'success';
            const lintErrorsFrontend = parseInt(LINT_ERRORS_FRONTEND || '0');
            const lintErrorsBackend = parseInt(LINT_ERRORS_BACKEND || '0');
            const totalLintErrors = lintErrorsFrontend + lintErrorsBackend;
            const fastMode   = FAST_MODE === 'true';
            const zenMode    = ZEN_MODE === 'true';
            const timeless   = TIMELESS === 'true';

            const footer = `\n\n---\n> *Triaged automatically by **vibecodia v2** · This is an automated implementation, not a human review.*`;

            let body = `### 🤖 IA Workflow v2 Results\n\n`;
            body += `**Mode:** ${fastMode ? '⚡ Fast (2min)' : zenMode ? '🧘 Zen (20min)' : timeless ? '🚀 Timeless (6h)' : '🧠 Full with AI Planner'}\n\n`;

            if (success && hasChanges && buildOk && pushOk) {
              body += `✅ **Success!** Changes implemented via **gpt-4o-mini + aider (v2)**.\n\n`;
              body += `- **Branch**: [**${BRANCH_NAME}**](${repoUrl}/tree/${BRANCH_NAME})\n`;
              body += `- **Build**: ✅ passed\n`;
              body += `- **Lint**: ${totalLintErrors === 0 ? '✅ no errors' : `⚠️ ${totalLintErrors} error(s) — review before merging`}\n`;
              if (PR_URL) {
                body += `- **PR**: [View Pull Request](${PR_URL})\n`;
              }
              if (AI_SUMMARY) {
                body += `\n**Files modified:**\n${AI_SUMMARY}\n`;
              }
              body += `\n> Review the PR and merge into \`develop\` when ready.`;
            } else if (success && hasChanges && !pushOk) {
              body += `❌ **AI made changes but push failed.**\n\n`;
              body += `The code was generated but could not be pushed to the repository.\n`;
              body += `Common cause: Permission issues or branch protection rules. Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for details.`;
            } else if (success && BUILD_OUTCOME === 'failure') {
              body += `⚠️ **AI made changes but the build failed.**\n\n`;
              body += `The generated code broke the frontend build — commit was blocked.\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for the build error.`;
            } else if (success && !hasChanges) {
              body += `⚠️ **AI ran but made no changes.**\n\n`;
              body += `Try adding more detail to the issue description.`;
            } else if (AIDER_OUTCOME === 'failure' || AIDER_OUTCOME === 'cancelled') {
              body += `❌ **Workflow failed due to timeout.**\n\n`;
              body += `The experimental AI-driven workflow has reached its limit.\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for details.`;
            } else {
              body += `❌ **Workflow failed.**\n\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for details.\n\n`;
              body += `Common causes: token limit exceeded, API quota, or task description too vague.`;
            }

            body += footer;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });