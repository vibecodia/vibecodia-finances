name: CI Feature & Auto PR
on:
  push:
    branches:
      - 'feature/*'
permissions:
  contents: write
  pull-requests: write
jobs:
  ci-and-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          PR_EXISTS=$(gh pr list --head ${{ github.ref_name }} --base develop --json number --jq '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --base develop \
              --head ${{ github.ref_name }} \
              --title "feat: ${{ github.ref_name }}" \
              --body "PR gerado automaticamente após sucesso do CI na branch de feature." \
              --draft
          fi