name: CI Feature & Auto PR
on:
  push:
    branches:
      - 'feature/*'
      - 'fix/*'
      - 'breaking/*'
permissions:
  contents: write
  pull-requests: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  auto-pr:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verificar alterações relevantes
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(frontend|backend|infra/docker)/'; then
            echo "relevant=true" >> $GITHUB_OUTPUT
          else
            echo "relevant=false" >> $GITHUB_OUTPUT
          fi

      - name: Sem alterações relevantes
        if: steps.check.outputs.relevant == 'false'
        run: |
          echo "⚠️ Nenhuma alteração em frontend/, backend/ ou infra/docker/."
          echo "O PR automático não será criado e nenhum deploy será disparado no servidor."

      - name: Create Pull Request
        if: steps.check.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          PR_EXISTS=$(gh pr list --head ${{ github.ref_name }} --base develop --json number --jq '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --base develop \
              --head ${{ github.ref_name }} \
              --title "PR Automático: ${{ github.ref_name }}" \
              --body "PR gerado automaticamente após sucesso do CI na branch de feature."
          fi