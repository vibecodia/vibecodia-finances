# .github/workflows/run-aider-from-issue.yml
name: "IA-Driven Development Workflow"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ia-driven-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ia_driven_task:
    name: "🧠 IA-Driven Task (#${{ github.event.issue.number }})"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ia-driven')

    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📥 Install aider"
        run: pip install aider-chat --quiet

      - name: "🔧 Configure Git"
        run: |
          git config user.name "Aider Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"

      - name: "🔑 Validate secrets"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY não configurado — o workflow vai falhar"
            exit 1
          fi
          echo "✅ Secrets OK"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: "📁 Prepare task and branch"
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="ia/task-${ISSUE_NUMBER}-${TIMESTAMP}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          mkdir -p ia/tasks
          TASK_FILE="ia/tasks/task-${ISSUE_NUMBER}.md"
          echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT

          # Monta o arquivo de instrução para o aider
          # ISSUE_BODY vem de env var — nunca exposto diretamente no shell
          {
            echo "# Task — Issue #${ISSUE_NUMBER}"
            echo ""
            echo "## What needs to be done"
            echo "$ISSUE_BODY"
            echo ""
            echo "## Rules"
            echo "- Follow existing code patterns, file structure and naming conventions in the project"
            echo "- Frontend is under frontend/ (React, TypeScript, Vite, Tailwind CSS)"
            echo "- Backend is under backend/ (Node.js, Express, MongoDB/Mongoose)"
            echo "- Do not create new files unless strictly necessary — prefer editing existing ones"
            echo "- Do not modify unrelated files"
            echo "- Do not change package.json, lock files or config files unless the task explicitly requires it"
          } > "$TASK_FILE"

          git checkout -b "$BRANCH_NAME"

      - name: "🧠 Execute aider"
        id: aider_run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_FILE: ${{ steps.prepare.outputs.task_file }}
        run: |
          echo "::group::Executing aider"

          aider \
            --yes-always \
            --no-git \
            --model gpt-4o \
            --map-tokens 2048 \
            --no-auto-commits \
            --message "$(cat "$TASK_FILE")"

          echo "::endgroup::"

      - name: "💾 Commit and push changes"
        id: push_changes
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        run: |
          git add .

          if git diff --staged --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No code changes detected."
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            git commit \
              -m "feat(ia): implement solution for #${ISSUE_NUMBER}" \
              -m "Generated by aider + gpt-4o based on issue description." \
              -m "Issue: ${ISSUE_URL}"
          fi

          git push origin "$BRANCH_NAME"

      - name: "📬 Create Pull Request"
        id: create_pr
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          TASK_FILE: ${{ steps.prepare.outputs.task_file }}
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
        with:
          script: |
            const { BRANCH_NAME, TASK_FILE, CHANGES_DETECTED } = process.env;
            const issueNumber = context.issue.number;
            const issueTitle = context.payload.issue.title;

            if (CHANGES_DETECTED !== 'true') {
              console.log('ℹ️ No changes detected — skipping PR creation');
              return null;
            }

            try {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[IA] ${issueTitle} (#${issueNumber})`,
                head: BRANCH_NAME,
                base: 'develop',
                body: [
                  `This PR was automatically generated by **aider + gpt-4o** to address issue #${issueNumber}.`,
                  ``,
                  `- **Task file**: [View](${context.payload.repository.html_url}/blob/${BRANCH_NAME}/${TASK_FILE})`,
                  `- **Original issue**: #${issueNumber}`,
                  ``,
                  `> Please review carefully before merging.`,
                ].join('\n'),
                draft: true,
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.data.number,
                labels: ['ia-generated', 'waiting-review'],
              });

              console.log(`✅ Pull Request created: ${pr.data.html_url}`);
              return pr.data;
            } catch (error) {
              console.error(`❌ Error creating PR: ${error.message}`);
              return null;
            }

      - name: "📝 Generate step summary"
        if: always()
        env:
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
          AIDER_OUTCOME: ${{ steps.aider_run.outcome }}
          PR_RESULT: ${{ steps.create_pr.outputs.result }}
        run: |
          echo "## 🤖 IA-Driven Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          if [ "$AIDER_OUTCOME" == "success" ]; then
            echo "| ✅ | aider execution | Successfully completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ | aider execution | Failed — check logs |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CHANGES_DETECTED" == "true" ]; then
            echo "| ✅ | Changes | Code changes detected and pushed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ℹ️ | Changes | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          PR_URL=$(echo "${PR_RESULT:-{}}" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              try { const o=JSON.parse(d); process.stdout.write(o.html_url||''); } catch(e){}
            });
          ")
          if [ -n "$PR_URL" ]; then
            echo "| 🚀 | Pull Request | [View PR]($PR_URL) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🗣️ Comment on issue"
        if: always()
        uses: actions/github-script@v7
        env:
          PR_RESULT: ${{ steps.create_pr.outputs.result }}
          AIDER_OUTCOME: ${{ steps.aider_run.outcome }}
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        with:
          script: |
            const { PR_RESULT, AIDER_OUTCOME, CHANGES_DETECTED, BRANCH_NAME } = process.env;
            const prResult = PR_RESULT ? JSON.parse(PR_RESULT) : null;
            const success = AIDER_OUTCOME === 'success';
            const hasChanges = CHANGES_DETECTED === 'true';

            let body = `### 🤖 IA Workflow Results\n\n`;

            if (success && hasChanges) {
              body += `✅ **Success!** aider + gpt-4o implemented the changes.\n\n`;
              if (prResult?.html_url) {
                body += `- **Pull Request**: ${prResult.html_url} (Draft — please review before merging)\n`;
              }
              body += `- **Branch**: \`${BRANCH_NAME}\`\n`;
            } else if (success && !hasChanges) {
              body += `⚠️ **aider ran successfully but made no changes.**\n\n`;
              body += `This usually means the task description wasn't specific enough, or the code already satisfies the requirements.\n`;
              body += `Try adding more details to the issue.\n`;
            } else {
              body += `❌ **Failed!** aider encountered an error.\n\n`;
              body += `Please check the [Action logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });