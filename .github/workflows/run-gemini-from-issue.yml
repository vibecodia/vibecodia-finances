# .github/workflows/run-aider-from-issue.yml
name: "IA-Driven Development Workflow"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write

concurrency:
  group: ia-driven-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ia_driven_task:
    name: "🧠 IA-Driven Task (#${{ github.event.issue.number }})"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ia-driven')

    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "📥 Install aider"
        run: pip install aider-chat --quiet

      - name: "🔧 Configure Git"
        run: |
          git config user.name "IA Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"

      - name: "🔑 Validate secrets"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY não configurado"
            exit 1
          fi
          echo "✅ Secrets OK"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: "📁 Prepare task and branch"
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="ia/task-${ISSUE_NUMBER}-${TIMESTAMP}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          mkdir -p ia/tasks
          TASK_FILE="ia/tasks/task-${ISSUE_NUMBER}.md"
          echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT

          {
            echo "# Task — Issue #${ISSUE_NUMBER}"
            echo ""
            echo "## What needs to be done"
            echo "$ISSUE_BODY"
            echo ""
            echo "## Rules"
            echo "- Follow existing code patterns, file structure and naming conventions"
            echo "- Frontend is under frontend/ (React, TypeScript, Vite, Tailwind CSS)"
            echo "- Backend is under backend/ (Node.js, Express, MongoDB/Mongoose)"
            echo "- Do not modify unrelated files"
            echo "- Do not change package.json, lock files or config files unless explicitly required"
          } > "$TASK_FILE"

          git checkout -b "$BRANCH_NAME"

      # ────────────────────────────────────────────────────────────────────
      # PRIMARY: OpenAI gpt-4.1-nano com function calling
      # ────────────────────────────────────────────────────────────────────
      - name: "🧠 Primary: OpenAI gpt-4.1-nano + function calling"
        id: openai_run
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_FILE: ${{ steps.prepare.outputs.task_file }}
        run: |
          echo "::group::OpenAI function calling"

          node << 'JSEOF'
          const fs   = require('fs');
          const path = require('path');

          // ── 1. Lê a tarefa ──────────────────────────────────────────────
          const task = fs.readFileSync(process.env.TASK_FILE, 'utf8');

          // ── 2. Monta snapshot do codebase ───────────────────────────────
          const RELEVANT = [
            'frontend/src/components/Playground.tsx',
            'frontend/src/components/playground.tsx',
            'frontend/src/types/transaction.ts',
            'frontend/src/types/index.ts',
            'frontend/src/hooks/useTransactions.ts',
            'frontend/src/hooks/useDashboard.ts',
            'backend/src/routes/transactions.ts',
            'backend/src/routes/index.ts',
            'backend/src/models/Transaction.ts',
            'backend/src/models/transaction.model.ts',
          ];

          function walk(dir, exts) {
            if (!fs.existsSync(dir)) return [];
            const skip = new Set(['node_modules', 'dist', '.git', 'build', 'coverage']);
            const out  = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (skip.has(e.name)) continue;
              const full = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(full, exts));
              else if (exts.some(x => e.name.endsWith(x))) out.push(full);
            }
            return out;
          }

          const chartFiles = walk('frontend/src/components/charts', ['.ts', '.tsx']);
          const allFiles   = [...new Set([...RELEVANT, ...chartFiles])].filter(f => fs.existsSync(f));

          const MAX_LINES = 250;
          let codebaseContext = '';
          for (const f of allFiles) {
            const lines   = fs.readFileSync(f, 'utf8').split('\n');
            const content = lines.slice(0, MAX_LINES).join('\n');
            const note    = lines.length > MAX_LINES ? `\n... (+${lines.length - MAX_LINES} lines truncated)` : '';
            codebaseContext += `\n\n### ${f}\n\`\`\`\n${content}${note}\n\`\`\``;
          }

          console.log(`📁 Context: ${allFiles.length} files loaded`);

          // ── 3. Ferramentas ──────────────────────────────────────────────
          const tools = [{
            type: 'function',
            function: {
              name: 'write_file',
              description: 'Write or overwrite a file in the repository. Call once per file that needs to be created or modified. Always include the COMPLETE file content.',
              parameters: {
                type: 'object',
                properties: {
                  path:    { type: 'string', description: 'Relative path from repo root, e.g. frontend/src/components/MyChart.tsx' },
                  content: { type: 'string', description: 'Complete file content — every existing line preserved, plus your additions' },
                  reason:  { type: 'string', description: 'One-line explanation of the change' },
                },
                required: ['path', 'content', 'reason'],
              },
            },
          }];

          // ── 4. System prompt com regra explícita de não apagar conteúdo ─
          const systemPrompt = `You are a senior full-stack engineer working on a real codebase.
          You will receive a task and the relevant source files of the project.
          Implement the requested changes by calling write_file for every file you need to create or modify.

          CRITICAL RULES:
          - When modifying an existing file, you MUST include the COMPLETE file content — every line that already existed, plus your additions. Never omit existing code.
          - Before writing a file, mentally verify: "Does this output contain everything that was in the original file?"
          - If you are adding a new component or function to a file, keep ALL existing imports, components, functions, types and exports intact. Only add what is new.
          - Do not touch unrelated files.
          - New backend routes must follow the same pattern as existing routes.
          - New frontend components must follow the same structure as existing components.
          - Do not change package.json, lock files, or config files unless the task explicitly requires it.`;

          // ── 5. Chama a API ──────────────────────────────────────────────
          async function run() {
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
              },
              body: JSON.stringify({
                model: 'gpt-4.1-nano',
                temperature: 0.1,
                tool_choice: 'required',
                tools,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user',   content: `## Task\n${task}\n\n## Codebase\n${codebaseContext}` },
                ],
              }),
            });

            const data = await resp.json();

            if (!resp.ok) {
              console.error('OpenAI error:', JSON.stringify(data, null, 2));
              process.exit(1);
            }

            const calls = data.choices[0].message.tool_calls || [];

            if (calls.length === 0) {
              console.error('❌ No tool calls returned — nothing written');
              process.exit(1);
            }

            // ── 6. Escreve os arquivos com verificação de content loss ────
            const cwd = path.resolve(process.cwd());
            let warnings = 0;

            for (const call of calls) {
              if (call.function.name !== 'write_file') continue;
              const { path: filePath, content, reason } = JSON.parse(call.function.arguments);

              const fullPath = path.resolve(cwd, filePath);
              if (!fullPath.startsWith(cwd + path.sep)) {
                console.error(`❌ Path traversal bloqueado: ${filePath}`);
                continue;
              }

              // Verifica se o arquivo encolheu demais (provável perda de conteúdo)
              if (fs.existsSync(fullPath)) {
                const originalLines = fs.readFileSync(fullPath, 'utf8').split('\n').length;
                const newLines      = content.split('\n').length;
                if (newLines < originalLines * 0.7) {
                  console.warn(`⚠️  WARNING: ${filePath} shrunk from ${originalLines} to ${newLines} lines — possible content loss!`);
                  warnings++;
                }
              }

              fs.mkdirSync(path.dirname(fullPath), { recursive: true });
              fs.writeFileSync(fullPath, content, 'utf8');
              console.log(`✅ Written: ${filePath} — ${reason}`);
            }

            if (warnings > 0) {
              console.warn(`\n⚠️  ${warnings} file(s) may have lost content. Review the branch carefully before merging.`);
            }

            console.log(`\n🎉 Done. ${calls.length} file(s) written.`);

            const summary = calls
              .map(c => { const a = JSON.parse(c.function.arguments); return `- \`${a.path}\`: ${a.reason}`; })
              .join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ai_summary<<EOF\n${summary}\nEOF\n`);
          }

          run().catch(err => { console.error(err); process.exit(1); });
          JSEOF

          echo "::endgroup::"

          # ────────────────────────────────────────────────────────────────────
          # FALLBACK: aider com arquivos cirúrgicos
          # Só roda se o OpenAI falhar (rate limit, token limit, erro de API)
          # ────────────────────────────────────────────────────────────────────
      - name: "🔁 Fallback: aider + gpt-4.1-nano"
        id: aider_run
        if: steps.openai_run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_FILE: ${{ steps.prepare.outputs.task_file }}
        run: |
          echo "::group::Aider fallback"
          echo "⚠️ OpenAI function calling failed — trying aider with surgical context"

          RELEVANT_FILES=""
          for f in \
            "frontend/src/components/Playground.tsx" \
            "frontend/src/components/playground.tsx" \
            "frontend/src/types/transaction.ts" \
            "frontend/src/types/index.ts" \
            "frontend/src/hooks/useTransactions.ts" \
            "frontend/src/hooks/useDashboard.ts" \
            "backend/src/routes/transactions.ts" \
            "backend/src/routes/index.ts" \
            "backend/src/models/Transaction.ts" \
            "backend/src/models/transaction.model.ts"
          do
            [ -f "$f" ] && RELEVANT_FILES="$RELEVANT_FILES $f"
          done

          CHART_FILES=$(find frontend/src/components/charts -type f \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null | head -10 | tr '\n' ' ')
          RELEVANT_FILES="$RELEVANT_FILES $CHART_FILES"

          echo "📄 Files: $RELEVANT_FILES"

          aider \
            --yes-always \
            --no-pretty \
            --model gpt-4.1-nano \
            --map-tokens 512 \
            --no-auto-commits \
            --message "$(cat "$TASK_FILE")" \
            $RELEVANT_FILES

          echo "::endgroup::"

      - name: "💾 Commit and push changes"
        id: push_changes
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          OPENAI_OUTCOME: ${{ steps.openai_run.outcome }}
        run: |
          git reset HEAD .aider.chat.history.md .aider.input.history 2>/dev/null || true
          git add .

          if git diff --staged --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No code changes detected."
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT

            ENGINE="gpt-4.1-nano + function calling"
            [ "$OPENAI_OUTCOME" != "success" ] && ENGINE="aider fallback"

            git commit \
              -m "feat(ia): implement solution for #${ISSUE_NUMBER}" \
              -m "Generated by ${ENGINE}." \
              -m "Issue: ${ISSUE_URL}"
          fi

          git push origin "$BRANCH_NAME"

      - name: "📝 Generate step summary"
        if: always()
        env:
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
          OPENAI_OUTCOME: ${{ steps.openai_run.outcome }}
          AIDER_OUTCOME: ${{ steps.aider_run.outcome }}
          AI_SUMMARY: ${{ steps.openai_run.outputs.ai_summary }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        run: |
          echo "## 🤖 IA-Driven Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          if [ "$OPENAI_OUTCOME" == "success" ]; then
            echo "| ✅ | Primary (gpt-4.1-nano function calling) | Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "$AIDER_OUTCOME" == "success" ]; then
            echo "| ⚠️ | Primary (gpt-4.1-nano function calling) | Failed — used fallback |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ | Fallback (aider) | Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ | Primary (gpt-4.1-nano function calling) | Failed |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ | Fallback (aider) | Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CHANGES_DETECTED" == "true" ]; then
            echo "| ✅ | Changes | Pushed to \`$BRANCH_NAME\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ℹ️ | Changes | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$AI_SUMMARY" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Files modified" >> $GITHUB_STEP_SUMMARY
            echo "$AI_SUMMARY" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🗣️ Comment on issue"
        if: always()
        uses: actions/github-script@v7
        env:
          OPENAI_OUTCOME: ${{ steps.openai_run.outcome }}
          AIDER_OUTCOME: ${{ steps.aider_run.outcome }}
          CHANGES_DETECTED: ${{ steps.push_changes.outputs.changes_detected }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          AI_SUMMARY: ${{ steps.openai_run.outputs.ai_summary }}
        with:
          script: |
            const { OPENAI_OUTCOME, AIDER_OUTCOME, CHANGES_DETECTED, BRANCH_NAME, AI_SUMMARY } = process.env;
            const repoUrl    = context.payload.repository.html_url;
            const hasChanges = CHANGES_DETECTED === 'true';
            const success    = OPENAI_OUTCOME === 'success' || AIDER_OUTCOME === 'success';
            const engine     = OPENAI_OUTCOME === 'success' ? 'gpt-4.1-nano + function calling' : 'aider fallback';

            let body = `### 🤖 IA Workflow Results\n\n`;

            if (success && hasChanges) {
              body += `✅ **Success!** Changes implemented via **${engine}**.\n\n`;
              body += `- **Branch**: [\`${BRANCH_NAME}\`](${repoUrl}/tree/${BRANCH_NAME})\n`;
              if (AI_SUMMARY) {
                body += `\n**Files modified:**\n${AI_SUMMARY}\n`;
              }
              body += `\n> Checkout the branch, review carefully and merge into \`develop\` when ready.`;
            } else if (success && !hasChanges) {
              body += `⚠️ **AI ran but made no changes.**\n\n`;
              body += `Try adding more detail to the issue description.`;
            } else {
              body += `❌ **Both primary and fallback failed.**\n\n`;
              body += `Check the [Action logs](${repoUrl}/actions/runs/${context.runId}) for details.\n\n`;
              body += `Common causes: token limit exceeded, API quota, or task description too vague.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
