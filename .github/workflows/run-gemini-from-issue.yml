# .github/workflows/run-gemini-from-issue.yml
name: "IA-Driven Development Workflow"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ia-driven-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ia_driven_task:
    name: "🧠 IA-Driven Task (#${{ github.event.issue.number }})"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'ia-driven')

    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: 'develop'
          fetch-depth: 0

      - name: "📦 Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "🔧 Configure Git"
        run: |
          git config user.name "Gemini-CLI Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"

      - name: "📂 Build codebase context"
        id: build_codebase_context
        run: |
          mkdir -p ia/context
          SNAPSHOT_FILE="ia/context/codebase-snapshot.md"
          
          echo "🔍 Generating codebase snapshot..."
          
          {
            echo "# Codebase Snapshot"
            echo ""
            echo "## Project Structure (.ts, .tsx)"
            echo "\`\`\`"
            find . -maxdepth 10 -type f \( -name "*.ts" -o -name "*.tsx" \) \
              -not -path "*/node_modules/*" \
              -not -path "*/dist/*" \
              -not -path "*/.git/*" | sed 's|^\./||' | sort
            echo "\`\`\`"
            echo ""
            echo "## Relevant File Contents"
            echo ""
          } > "$SNAPSHOT_FILE"

          # Configurable globs
          GLOBS=(
            "frontend/src/components/*.tsx"
            "frontend/src/types/*.ts"
            "frontend/src/hooks/*.ts"
            "backend/src/routes/*.ts"
            "backend/src/models/*.ts"
            "backend/*.js"
          )

          for pattern in "${GLOBS[@]}"; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                echo "📄 Including: $file"
                echo "### File: $file" >> "$SNAPSHOT_FILE"
                EXT="${file##*.}"
                LANG="text"
                [[ "$EXT" == "ts" || "$EXT" == "tsx" ]] && LANG="typescript"
                [[ "$EXT" == "js" ]] && LANG="javascript"
                echo "\`\`\`$LANG" >> "$SNAPSHOT_FILE"
                cat "$file" >> "$SNAPSHOT_FILE"
                echo "" >> "$SNAPSHOT_FILE"
                echo "\`\`\`" >> "$SNAPSHOT_FILE"
                echo "" >> "$SNAPSHOT_FILE"
              fi
            done
          done

      - name: "📁 Validate templates and prepare context"
        id: prepare_context
        env:
          TASK_DESCRIPTION: ${{ github.event.issue.body }}
        run: |
          mkdir -p ia/templates
          TEMPLATE_PATH="ia/templates/001-general.md"

          if [ ! -s "$TEMPLATE_PATH" ]; then
            echo "⚠️ Template missing, creating a default one..."
            cat <<EOF > "$TEMPLATE_PATH"
          You are an expert software engineer. Analyze the following task and implement the necessary changes.
          Follow the project's coding standards and best practices.
          EOF
          fi

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="ia/task-${{ github.event.issue.number }}-$TIMESTAMP"
          PLAN_FILE_PATH="ia/plans/plan-${{ github.event.issue.number }}.md"
          mkdir -p ia/plans

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "plan_file_path=$PLAN_FILE_PATH" >> $GITHUB_OUTPUT

          # Prepare Plan Content
          TEMPLATE_CONTENT=$(cat "$TEMPLATE_PATH")

          {
            echo "# 🧠 AI Action Plan - Issue #${{ github.event.issue.number }}"
            echo ""
            echo "## 🎯 Task Description"
            echo "$TASK_DESCRIPTION"
            echo ""
            echo "## 📋 Instructions"
            echo "$TEMPLATE_CONTENT"
            echo ""
            echo "🛑 *Note: Respond with the complete file content for each file you modify using the format: FILE:path/to/file.ext\n\`\`\`\nCONTENT\n\`\`\`\n*"
            
            if [ -f "ia/context/codebase-snapshot.md" ]; then
              echo ""
              echo "## Existing codebase (read before writing anything)"
              cat "ia/context/codebase-snapshot.md"
            fi
          } > "$PLAN_FILE_PATH"

      - name: "🌱 Create branch and commit plan"
        run: |
          git checkout -b ${{ steps.prepare_context.outputs.branch_name }}
          git add ia/
          git commit -m "docs(ia): initialize plan for issue #${{ github.event.issue.number }}" || true

      - name: "🧠 Execute Gemini-CLI"
        id: gemini_run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAN_FILE: ${{ steps.prepare_context.outputs.plan_file_path }}
        run: |
          echo "::group::Executing Gemini-CLI"
          set +e
          # Passing prompt via stdin
          RESULT=$(npx --yes @google/gemini-cli --approval-mode yolo < "$PLAN_FILE" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "::endgroup::"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "⚠️ Gemini-CLI failed (likely quota). Moving to fallback."
            echo "error_msg=$RESULT" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🧠 Fallback: Execute OpenAI"
        if: steps.gemini_run.outcome == 'failure'
        id: openai_run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLAN_FILE_PATH: ${{ steps.prepare_context.outputs.plan_file_path }}
          OPENAI_MODEL: "gpt-4o-mini"
        run: |
          echo "::group::Executing OpenAI Fallback"
          node -e "
          async function run() {
            const fs = require('fs');
            const path = require('path');
            
            if (!fs.existsSync(process.env.PLAN_FILE_PATH)) {
              console.error('Plan file not found:', process.env.PLAN_FILE_PATH);
              process.exit(1);
            }
            
            const prompt = fs.readFileSync(process.env.PLAN_FILE_PATH, 'utf8');
            
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': \`Bearer \${process.env.OPENAI_API_KEY}\`
              },
              body: JSON.stringify({
                model: process.env.OPENAI_MODEL,
                messages: [
                  { role: 'system', content: 'You are a senior developer. Apply the plan and return the full content of modified files using the format: FILE:path/to/file\nCONTENT_START\n[FILE CONTENT]\nCONTENT_END' },
                  { role: 'user', content: prompt }
                ],
                temperature: 0.1
              })
            });

            const data = await resp.json();
            if (!resp.ok) {
              console.error('OpenAI Error:', JSON.stringify(data, null, 2));
              process.exit(1);
            }

            const text = data.choices[0].message.content;
            console.log('--- OPENAI RESPONSE START ---');
            console.log(text);
            console.log('--- OPENAI RESPONSE END ---');

            // Parser
            const fileBlocks = text.split('FILE:');
            for (let block of fileBlocks) {
              if (!block.includes('CONTENT_START')) continue;
              
              const parts = block.split('CONTENT_START');
              const filePath = parts[0].trim().split('\n')[0].trim();
              const contentParts = parts[1].split('CONTENT_END');
              
              if (filePath && contentParts.length > 0) {
                const content = contentParts[0].trim();
                console.log('✅ Found file to write:', filePath);
                
                const fullPath = path.resolve(process.cwd(), filePath);
                const dir = path.dirname(fullPath);
                
                if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
                fs.writeFileSync(fullPath, content);
                console.log('💾 Successfully written:', filePath);
              }
            }
            
            const summary = text.substring(0, 1000) + (text.length > 1000 ? '...' : '');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'result<<EOF\n' + summary + '\nEOF\n');
          }
          run().catch(err => { console.error(err); process.exit(1); });
          "
          echo "::endgroup::"

      - name: "💾 Commit and Push changes"
        id: push_changes
        run: |
          git add .
          
          if git diff --staged --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No code changes detected."
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            git commit -m "feat(ia): implement solution for #${{ github.event.issue.number }}" \
                       -m "Generated by Gemini-CLI based on issue description." \
                       -m "Issue: ${{ github.event.issue.html_url }}"
          fi
          
          git push origin ${{ steps.prepare_context.outputs.branch_name }}

      - name: "📬 Create Pull Request"
        id: create_pr
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.prepare_context.outputs.branch_name }}
          PLAN_FILE_PATH: ${{ steps.prepare_context.outputs.plan_file_path }}
        with:
          script: |
            const { BRANCH_NAME, PLAN_FILE_PATH } = process.env;
            const issueNumber = context.issue.number;
            const issueTitle = context.payload.issue.title;
            
            try {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[IA] ${issueTitle} (#${issueNumber})`,
                head: BRANCH_NAME,
                base: 'develop',
                body: `This PR was automatically generated by IA to address issue #${issueNumber}.\n\n` +
                      `- **Action Plan**: [Link to Plan](${context.payload.repository.html_url}/blob/${BRANCH_NAME}/${PLAN_FILE_PATH})\n` +
                      `- **Original Issue**: #${issueNumber}\n\n` +
                      `Please review the changes and merge if they meet the requirements.`,
                draft: true
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.data.number,
                labels: ['ia-generated', 'waiting-review']
              });
              
              console.log(`✅ Pull Request created: ${pr.data.html_url}`);
              return pr.data;
            } catch (error) {
              console.error(`❌ Error creating PR: ${error.message}`);
              return null;
            }

      - name: "📝 Generate Step Summary"
        if: always()
        run: |
          echo "## 🤖 IA-Driven Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.gemini_run.outcome }}" == "success" ]; then
            echo "| ✅ | AI Execution | Successfully completed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.openai_run.outcome }}" == "success" ]; then
             echo "| ✅ | AI Execution | Completed via OpenAI Fallback |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ | AI Execution | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.push_changes.outputs.changes_detected }}" == "true" ]; then
            echo "| ✅ | Changes | Code changes detected and pushed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ℹ️ | Changes | No changes detected |" >> $GITHUB_STEP_SUMMARY
          fi
          
          PR_URL="${{ fromJSON(steps.create_pr.outputs.result || '{}').html_url }}"
          if [ -n "$PR_URL" ]; then
            echo "| 🚀 | Pull Request | [View PR]($PR_URL) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🗣️ Comment on Issue"
        if: always()
        uses: actions/github-script@v7
        env:
          PR_RESULT: ${{ steps.create_pr.outputs.result }}
          GEMINI_RESULT: ${{ steps.gemini_run.outputs.result }}
          OPENAI_RESULT: ${{ steps.openai_run.outputs.result }}
          BRANCH_NAME: ${{ steps.prepare_context.outputs.branch_name }}
          GEMINI_OUTCOME: ${{ steps.gemini_run.outcome }}
          OPENAI_OUTCOME: ${{ steps.openai_run.outcome }}
        with:
          script: |
            const { PR_RESULT, GEMINI_RESULT, OPENAI_RESULT, BRANCH_NAME, GEMINI_OUTCOME, OPENAI_OUTCOME } = process.env;
            const prResult = PR_RESULT ? JSON.parse(PR_RESULT) : null;
            const aiResult = GEMINI_RESULT || OPENAI_RESULT || "";
            const success = GEMINI_OUTCOME === "success" || OPENAI_OUTCOME === "success";
            
            let body = `### 🤖 IA Workflow Results\n\n`;
            
            if (success) {
              body += `✅ **Success!** AI has processed the task.\n\n`;
              if (prResult && prResult.html_url) {
                body += `- **Pull Request**: ${prResult.html_url} (Draft)\n`;
              }
              body += `- **Branch**: \`${BRANCH_NAME}\`\n\n`;
              if (aiResult) {
                body += `#### AI Output Summary:\n\`\`\`\n${aiResult}\n\`\`\``;
              }
            } else {
              body += `❌ **Failed!** AI execution encountered an error.\n\n`;
              body += `Please check the [Action logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for more details.`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
