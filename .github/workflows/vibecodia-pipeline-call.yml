name: Release & Trigger
on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infra/docker/**'
jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    outputs:
      mergeable: ${{ steps.check.outputs.mergeable }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            let mergeable = null;
            let attempts = 0;
            const maxAttempts = 5;

            while (mergeable === null && attempts < maxAttempts) {
              attempts++;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number
              });

              mergeable = pr.mergeable;

              if (mergeable === null) {
                console.log(`Tentativa ${attempts}/${maxAttempts} — aguardando 10s...`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }

            if (mergeable === null) {
              core.summary
                .addHeading('⚠️ Não foi possível verificar conflitos')
                .addRaw('O deploy foi bloqueado por precaução. Feche e reabra o PR.')
                .write();
              core.setOutput('mergeable', 'false');
            } else if (mergeable === false) {
              core.summary
                .addHeading('⚠️ PR com conflitos — deploy bloqueado')
                .addRaw('Resolva os conflitos antes de prosseguir.')
                .write();
              core.setOutput('mergeable', 'false');
            } else {
              core.setOutput('mergeable', 'true');
            }

  release:
    needs: check-conflicts
    if: |
      needs.check-conflicts.outputs.mergeable == 'true' &&
      startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Verificar se tag já existe
        id: tag-check
        run: |
          git fetch --tags
          VERSION=$(node -p "require('./package.json').version")
          if git tag | grep -q "^v$VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - run: npm run release -- --ci
        if: steps.tag-check.outputs.exists == 'false'
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
      - id: version
        run: |
          if [ "${{ steps.tag-check.outputs.exists }}" = "true" ]; then
            echo "⚠️ Tag já existe, pulando build e deploy."
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

  build-images:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-finances',
              workflow_id: 'build-push.yml',
              ref: 'develop',
              inputs: {
                version: '${{ needs.release.outputs.version }}',
                pr_branch: '${{ github.head_ref }}'
              }
            })

      - name: Aguardar build completar
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await new Promise(resolve => setTimeout(resolve, 10000));
            
            let completed = false;
            let attempts = 0;
            
            while (!completed && attempts < 30) {
              attempts++;
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: 'vibecodia',
                repo: 'vibecodia-finances',
                workflow_id: 'build-push.yml',
                per_page: 1
              });
              
              const run = runs.workflow_runs[0];
              console.log(`Status: ${run.status} | Conclusão: ${run.conclusion}`);
              
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed('Build das imagens falhou');
                }
                completed = true;
              } else {
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
            }
            
            if (!completed) {
              core.setFailed('Timeout aguardando build das imagens');
            }

  trigger:
    needs: [release, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-pipelines',
              workflow_id: '01_finances-update-pods.yml',
              ref: 'main',
              inputs: {
                pr_number: context.payload.pull_request.number.toString(),
                pr_branch: context.payload.pull_request.head.ref,
                version: '${{ needs.release.outputs.version }}'
              }
            })