name: Disparar Workflow em Outro Repo

on:
  pull_request:
    types: [opened, edited, reoppened]

jobs:
  trigger-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disparar workflow em vibecodia-pipeline
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: >
            github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-pipelines',
              workflow_id: 'finances-dry-run.yml',
              ref: 'main',
              inputs: {
                pr_number: context.payload.pull_request.number.toString(),
                pr_branch: context.payload.pull_request.head.ref // Adicione esta linha para passar o branch
              }
            })

      - name: Confirmar disparo
        run: echo "Workflow disparado no repositório destino para o PR ${{ github.event.pull_request.number }}"