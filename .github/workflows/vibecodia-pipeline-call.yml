name: Release & Trigger
on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infra/docker/**'
jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    outputs:
      mergeable: ${{ steps.check.outputs.mergeable }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            let mergeable = null;
            let attempts = 0;
            const maxAttempts = 5;

            while (mergeable === null && attempts < maxAttempts) {
              attempts++;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number
              });

              mergeable = pr.mergeable;

              if (mergeable === null) {
                console.log(`Tentativa ${attempts}/${maxAttempts} — GitHub ainda calculando mergeabilidade, aguardando 10s...`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }

            if (mergeable === null) {
              core.summary
                .addHeading('⚠️ Não foi possível verificar conflitos')
                .addRaw('O GitHub não retornou o status de mergeabilidade após várias tentativas.')
                .addEOL()
                .addRaw('O deploy foi bloqueado por precaução. Feche e reabra o PR para tentar novamente.')
                .write();
              core.setOutput('mergeable', 'false');
            } else if (mergeable === false) {
              core.summary
                .addHeading('⚠️ PR com conflitos — deploy bloqueado')
                .addRaw('Este PR possui conflitos com a branch `develop`.')
                .addEOL()
                .addRaw('Resolva os conflitos antes de prosseguir com o release e deploy.')
                .write();
              core.setOutput('mergeable', 'false');
            } else {
              core.setOutput('mergeable', 'true');
            }

  release:
    needs: check-conflicts
    if: |
      needs.check-conflicts.outputs.mergeable == 'true' &&
      startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verificar se tag já existe
        id: tag-check
        run: |
          git fetch --tags
          VERSION=$(node -p "require('./package.json').version")
          if git tag | grep -q "^v$VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v$VERSION já existe, pulando release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - run: npm run release -- --ci
        if: steps.tag-check.outputs.exists == 'false'
        env:
          MY_PAT: ${{ secrets.MY_PAT }}

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  trigger:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-pipelines',
              workflow_id: '01_finances-update-pods.yml',
              ref: 'main',
              inputs: {
                pr_number: context.payload.pull_request.number.toString(),
                pr_branch: context.payload.pull_request.head.ref,
                version: '${{ needs.release.outputs.version }}'
              }
            })