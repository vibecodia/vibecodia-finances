name: Disparar Workflow em Outro Repo

on:
  pull_request:
    types: [opened]

jobs:
  trigger-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disparar workflow em vibecodia-pipeline
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-pipelines',
              workflow_id: 'dry-run.yml',
              ref: 'main',
              inputs: {
                branch_name: context.payload.pull_request.head.ref
              }
            })

      - name: Confirmar disparo
        run: echo "Workflow disparado no repositório destino para a branch ${{ github.event.pull_request.head.ref }}"
