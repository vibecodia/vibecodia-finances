name: Release & Trigger
on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened, edited]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infra/**'
      - '.github/**'
      - '*.json'
      - '*.ts'
      - '*.js'
      - '*.config.*'
jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    outputs:
      mergeable: ${{ steps.check.outputs.mergeable }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            let mergeable = null;
            let attempts = 0;
            const maxAttempts = 5;

            while (mergeable === null && attempts < maxAttempts) {
              attempts++;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number
              });

              mergeable = pr.mergeable;

              if (mergeable === null) {
                console.log(`Tentativa ${attempts}/${maxAttempts} — aguardando 10s...`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }

            if (mergeable === null) {
              core.summary
                .addHeading('⚠️ Não foi possível verificar conflitos')
                .addRaw('O deploy foi bloqueado por precaução. Feche e reabra o PR.')
                .write();
              core.setOutput('mergeable', 'false');
            } else if (mergeable === false) {
              core.summary
                .addHeading('⚠️ PR com conflitos — deploy bloqueado')
                .addRaw('Resolva os conflitos antes de prosseguir.')
                .write();
              core.setOutput('mergeable', 'false');
            } else {
              core.setOutput('mergeable', 'true');
            }

  detect-change-type:
    needs: check-conflicts
    if: |
      needs.check-conflicts.outputs.mergeable == 'true' &&
      startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}
          ref: ${{ github.head_ref }}
      - name: Detectar tipo de mudança
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/develop...HEAD)
          echo "Arquivos alterados:"
          echo "$CHANGED"

          APP_CHANGED=false
          BUILD_CHANGED=false

          if echo "$CHANGED" | grep -qE '^(frontend|backend)/|^[^/]+\.(json|ts|js|config\..*)$'; then
            APP_CHANGED=true
          fi

          if echo "$CHANGED" | grep -qE '^(infra/|\.github/)'; then
            BUILD_CHANGED=true
          fi

          echo "app=$APP_CHANGED" >> $GITHUB_OUTPUT
          echo "build=$BUILD_CHANGED" >> $GITHUB_OUTPUT
          echo "App changed: $APP_CHANGED | Build changed: $BUILD_CHANGED"

  release:
    needs: detect-change-type
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verificar se tag app já existe
        id: tag-check
        run: |
          git fetch --tags
          VERSION=$(node -p "require('./package.json').version")
          if git tag | grep -q "^v$VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Release app version
        if: |
          needs.detect-change-type.outputs.app == 'true' &&
          steps.tag-check.outputs.exists == 'false'
        run: npm run release -- --ci
        env:
          MY_PAT: ${{ secrets.MY_PAT }}

      - name: Release build version
        if: |
          needs.detect-change-type.outputs.build == 'true' &&
          needs.detect-change-type.outputs.app == 'false'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BUILD_NUM=$(git tag | grep '^build-' | wc -l)
          BUILD_TAG="build-$((BUILD_NUM + 1))"
          git tag -a "$BUILD_TAG" -m "Build $BUILD_TAG"
          git push origin "$BUILD_TAG"
          echo "🏗️ Build tag criada: $BUILD_TAG"

      - id: version
        run: |
          if [ "${{ needs.detect-change-type.outputs.app }}" = "true" ] && [ "${{ steps.tag-check.outputs.exists }}" = "false" ]; then
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - id: build_version
        run: |
          if [ "${{ needs.detect-change-type.outputs.build }}" = "true" ] && [ "${{ needs.detect-change-type.outputs.app }}" = "false" ]; then
            BUILD_NUM=$(git tag | grep '^build-' | wc -l)
            echo "build_version=build-$BUILD_NUM" >> $GITHUB_OUTPUT
          else
            echo "build_version=" >> $GITHUB_OUTPUT
          fi

  build-images:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-finances',
              workflow_id: 'build-push.yml',
              ref: 'develop',
              inputs: {
                version: '${{ needs.release.outputs.version }}',
                pr_branch: '${{ github.head_ref }}'
              }
            })

      - name: Aguardar build completar
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await new Promise(resolve => setTimeout(resolve, 10000));

            let completed = false;
            let attempts = 0;

            while (!completed && attempts < 30) {
              attempts++;
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: 'vibecodia',
                repo: 'vibecodia-finances',
                workflow_id: 'build-push.yml',
                per_page: 1
              });

              const run = runs.workflow_runs[0];
              console.log(`Status: ${run.status} | Conclusão: ${run.conclusion}`);

              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed('Build das imagens falhou');
                }
                completed = true;
              } else {
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
            }

            if (!completed) {
              core.setFailed('Timeout aguardando build das imagens');
            }

  trigger:
    needs: [release, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'vibecodia',
              repo: 'vibecodia-pipelines',
              workflow_id: '01_finances-update-pods.yml',
              ref: 'main',
              inputs: {
                pr_number: context.payload.pull_request.number.toString(),
                pr_branch: context.payload.pull_request.head.ref,
                version: '${{ needs.release.outputs.version }}'
              }
            })