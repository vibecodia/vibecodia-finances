# Servidor SPA mínimo do staging-frontend (staging.finances.vibecodia.com.br).
#
# Diferente do nginx.conf do edge (que serve todos os vhosts e termina TLS),
# este container serve APENAS os arquivos estáticos do frontend buildado.
# A API não passa por aqui: o edge roteia `location /api/` direto para o
# staging-backend, então o SPA (build sem VITE_API_BASE_URL) chama `/api`
# same-origin e o edge resolve o resto.

server {
    listen 80;
    server_name staging.finances.vibecodia.com.br;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
