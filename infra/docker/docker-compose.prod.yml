services:
  frontend:
    image: ghcr.io/vibecodia/vibecodia-finances-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
      - rede-global-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    container_name: financial-app-frontend

  backend:
    image: ghcr.io/vibecodia/vibecodia-finances-backend:latest
    networks:
      - default
      - rede-global-proxy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: financial-app-backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health-check', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  default:
    driver: bridge
  rede-global-proxy:
    name: rede-global-proxy
    driver: bridge