services:
  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_PIN_CODE: ${VITE_PIN_CODE}
        VITE_VERIFICATION_COOKIE_NAME: ${VITE_VERIFICATION_COOKIE_NAME}
        VITE_VERIFICATION_TIMEOUT_MS: ${VITE_VERIFICATION_TIMEOUT_MS}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
      - rede-global-proxy
    env_file:
      - .env
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    container_name: financial-app-frontend

  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    networks:
      - default
      - rede-global-proxy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: financial-app-backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health-check', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  default:
    driver: bridge
  rede-global-proxy:
    name: rede-global-proxy
    driver: bridge